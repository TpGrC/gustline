name: Update forecast and publish Windrova

on:
  schedule:
    # GFS runs (00/06/12/18 UTC) finish about 4-5 hours later
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install numpy eccodes
      - name: Keep the last published forecast (used if NOAA is down)
        run: |
          git fetch -q --depth 1 origin gh-pages || true
          mkdir -p /tmp/lastsite
          git --work-tree=/tmp/lastsite checkout origin/gh-pages -- data 2>/dev/null || true
          ls /tmp/lastsite/data 2>/dev/null | head -3 || true
      - name: Download GFS and build map data
        id: build
        continue-on-error: true
        run: python -u gustline_server.py --build-once
      - name: NOAA unavailable - reuse the last forecast
        if: steps.build.outcome == 'failure'
        run: |
          if [ -d /tmp/lastsite/data ]; then rm -rf site/data && cp -r /tmp/lastsite/data site/data; echo "Reused last forecast"; else echo "No previous data" && exit 1; fi
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="windrova-bot" -c user.email="windrova-bot@users.noreply.github.com" commit -q -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
