name: Update forecast and publish Windrova

on:
  schedule:
    # GFS runs (00/06/12/18 UTC) finish about 4-5 hours later
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        if: github.event_name != 'push'
        run: pip install numpy eccodes
      - name: Keep the last published forecast (used if NOAA is down)
        run: |
          git fetch -q --depth 1 origin gh-pages || true
          mkdir -p /tmp/lastsite
          git --work-tree=/tmp/lastsite checkout origin/gh-pages -- data 2>/dev/null || true
          ls /tmp/lastsite/data 2>/dev/null | head -3 || true
      - name: Site-only update - reuse the latest published forecast (fast)
        id: reuse
        if: github.event_name == 'push'
        run: |
          if [ -f /tmp/lastsite/data/latest.json ]; then rm -rf site/data && cp -r /tmp/lastsite/data site/data && echo "reused=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Download GFS and build map data
        id: build
        if: steps.reuse.outputs.reused != 'yes'
        continue-on-error: true
        run: python -u gustline_server.py --build-once
      - name: NOAA unavailable - reuse the last forecast
        if: steps.build.outcome == 'failure'
        run: |
          if [ -d /tmp/lastsite/data ]; then rm -rf site/data && cp -r /tmp/lastsite/data site/data; echo "Reused last forecast"; else echo "No previous data" && exit 1; fi
      - name: Download ECMWF (Premium model)
        id: ecmwf
        if: steps.reuse.outputs.reused != 'yes'
        continue-on-error: true
        timeout-minutes: 20
        run: python -u ecmwf_build.py
      - name: ECMWF unavailable - reuse the last ECMWF forecast
        if: steps.ecmwf.outcome == 'failure'
        run: |
          if [ -d /tmp/lastsite/data/ecmwf ]; then rm -rf site/data/ecmwf && cp -r /tmp/lastsite/data/ecmwf site/data/ecmwf; echo "Reused last ECMWF"; fi
      - name: Download GEM Canada (Premium model)
        id: gem
        if: steps.reuse.outputs.reused != 'yes'
        continue-on-error: true
        timeout-minutes: 30
        run: python -u gem_build.py
      - name: GEM unavailable - reuse the last GEM forecast
        if: steps.gem.outcome == 'failure'
        run: |
          if [ -d /tmp/lastsite/data/gem ]; then rm -rf site/data/gem && cp -r /tmp/lastsite/data/gem site/data/gem; echo "Reused last GEM"; fi
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="windrova-bot" -c user.email="windrova-bot@users.noreply.github.com" commit -q -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
