name: Update forecast and publish Windlume

on:
  schedule:
    # GFS runs (00/06/12/18 UTC) finish about 4-5 hours later
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install numpy eccodes
      - name: Download GFS and build map data
        run: python -u gustline_server.py --build-once
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="windlume-bot" -c user.email="windlume-bot@users.noreply.github.com" commit -q -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
