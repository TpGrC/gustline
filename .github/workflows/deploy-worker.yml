name: Deploy Windrova relay (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Add the CLOUDFLARE_API_TOKEN secret first"; exit 1; fi
          npx --yes wrangler@4 deploy
          # the same key lets the dashboard read visitor numbers (Account Analytics: Read)
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4 secret put CF_API_TOKEN
